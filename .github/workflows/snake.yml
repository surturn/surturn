name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#13223A&color_dots=#E2E8EF,#F7D9A6,#EDB65A,#D08912,#8A5A0A
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8EEF5&color_dots=#1B2B44,#5C4520,#9A6E27,#D39333,#F2A93B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
